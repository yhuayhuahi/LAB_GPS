services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qsy_backend_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_CLIENT=postgres
      - DATABASE_URL=postgresql://qsy_user:qsy_password@postgres:5432/qsy_db
      - JWT_SECRET=qsy_production_jwt_secret_key_change_in_real_deployment
      - JWT_EXPIRES_IN=8h
      - CORS_ORIGIN=*
      - APP_VERSION=1.0.0
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: qsy_postgres_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=qsy_db
      - POSTGRES_USER=qsy_user
      - POSTGRES_PASSWORD=qsy_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qsy_user -d qsy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
